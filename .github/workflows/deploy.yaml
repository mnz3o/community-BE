name: BE CI/CD Pipeline

# main 대상 PR에서는 이미지 빌드 검증, main Push 및 Merge 시 이미지 생성 후 배포
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    # 실행 환경의 일관성을 위해 Ubuntu 버전 고정
    runs-on: ubuntu-24.04

    steps:
      # Runner에 현재 저장소의 코드를 가져옴
      - name: 체크아웃
        uses: actions/checkout@v4

      # Docker Buildx 빌드 환경 설정
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 레지스트리 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: registry.ayelcommunity.site
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 빌드 캐시를 재사용하여 이미지를 빌드 후 main Push 시 레지스트리에 저장
      - name: Docker 이미지 빌드 및 Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: registry.ayelcommunity.site/community-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build

    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-24.04

    steps:

      - name: 체크아웃
        uses: actions/checkout@v4


      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2


      # SSM을 통해 App EC2에 BE 배포
      - name: BE Blue Green 환경 배포
        run: |
          bash scripts/ssm-deploy.sh \
            "${{ github.sha }}" \
            "${{ vars.INSTANCE_A }}" \
            "${{ github.repository }}"